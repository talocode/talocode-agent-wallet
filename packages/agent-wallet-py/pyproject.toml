[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talocode-agent-wallet"
version = "0.2.0"
description = "Python SDK, CLI, and MCP for Talocode Agent Wallet. Solana Devnet. Cannot sign."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Talocode" }]
keywords = ["talocode", "solana", "devnet", "agents", "wallet", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/talocode/talocode-agent-wallet"
Repository = "https://github.com/talocode/talocode-agent-wallet"
Issues = "https://github.com/talocode/talocode-agent-wallet/issues"

[project.scripts]
talocode-wallet = "talocode_agent_wallet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
